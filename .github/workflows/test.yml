name: Backend Tests

on:
  push:
    branches: [ main, dev, feature/write-api-unit-tests ]
  pull_request:
    branches: [ main, dev, feature/write-api-unit-tests ]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    # GitHub Actions service containers automatically create a PostgreSQL instance
    # This runs in a separate container and is accessible at localhost:5432
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nova_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov  # For coverage reporting

      - name: Run tests with coverage
        working-directory: ./backend
        env:
          # This connects to the PostgreSQL service container created above
          # The service container is automatically available at localhost:5432
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nova_test
        run: |
          pytest -v --tb=short --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
